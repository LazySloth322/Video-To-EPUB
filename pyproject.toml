[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-epub"
version = "0.1.0"
description = "Convert video presentations into EPUB books with Whisper transcripts and slide screenshots."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai-whisper>=20240930",
  "av>=11.0.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
  "ebooklib>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
video-to-epub = "video_to_epub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]